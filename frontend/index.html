<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600 mx-auto mb-4"></div>
        <p class="text-gray-600 font-medium">Carregando Cardápio Digital...</p>
    </div>

    <script>
        // Evita loop verificando se já estamos direcionando
        const token = localStorage.getItem('access_token');
        const role = localStorage.getItem('user_role');

        // Se for visitante ou cliente, vai para a pasta frontend/cliente/
        if (!token || role === 'CLIENTE') {
            window.location.replace('./cliente/index.html');
        } else if (role === 'LOJA') {
            window.location.replace('./loja/index.html');
        } else if (role === 'ENTREGADOR') {
            window.location.replace('./entregador/index.html');
        } else {
            window.location.replace('./cliente/index.html');
        }
    </script>
</body>
</html>
