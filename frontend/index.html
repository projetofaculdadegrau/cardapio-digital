<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600 mx-auto mb-4"></div>
        <p class="text-gray-600 font-medium">A verificar sessão...</p>
    </div>

    <script>
        // Verifica se já existe um token e um perfil salvos no navegador
        const token = localStorage.getItem('access_token');
        const role = localStorage.getItem('user_role');

        if (!token) {
            // Se não estiver logado, vai para o login
            window.location.href = './login/index.html';
        } else {
            // Se estiver logado, redireciona para o painel correspondente ao papel (role)
            if (role === 'LOJA') {
                window.location.href = './loja/index.html';
            } else if (role === 'CLIENTE') {
                window.location.href = './cliente/index.html';
            } else if (role === 'ENTREGADOR') {
                // Futuramente: window.location.href = './entregador/entregador.html';
                alert('Sessão ativa de Entregador detectada. Redirecionamento em desenvolvimento.');
                window.location.href = './login/index.html';
            } else {
                window.location.href = './login/index.html';
            }
        }
    </script>
</body>
</html>
