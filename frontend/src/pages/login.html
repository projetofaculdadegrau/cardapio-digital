<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre com sua conta no cardápio digital">
    <meta name="keywords" content="login, cardápio digital">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="icon" href="../public/favicon.ico">
    <title>Cardápio Digital | Login</title>
</head>

<body>
    <header>
        <h1>Cardápio Digital</h1>
        <p>Bem-vindo ao cardápio digital! Entre com sua conta para aproveitar todas as ofertas e fazer seu pedido!</p>
    </header>
    <main class="modal">
        <h2>Login</h2>
        <form class="login" action="">
            <label for="email">Digite seu email: </label>
            <input type="email" id="email" name="email" placeholder="usuario@gmail.com" autocomplete="email" required>
            <label for="password">Digite sua senha: </label>
            <input type="password" id="password" name="password" placeholder="***********"
                autocomplete="current-password" required>
            <button type="submit">Entrar</button>
            <div class="opcoes">
                <a href="#">Criar uma conta</a>
                <a href="#">Esqueci minha senha</a>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Cardápio Digital. Todos os direitos reservados.</p>
    </footer>
    <script type="module" src="../scripts/login.js"></script>
</body>

</html>
